<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mncf-version" content="2026-11-08a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNCF Entries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="css/style.css?v=2026-11-08a">
</head>
<body class="wide">
<div class="wrap">
  <header>
    <nav class="nav" aria-label="Pages"><a href="index.html">All shows</a><a href="register.html" aria-current="page">Register dogs</a><a id="awardsLink" href="awards.html">Awards</a></nav>
    <h1>Register dogs</h1>
    <div class="sub" id="showSub">Pick a show to see its entries.</div>
  </header>
  <section class="panel" id="pickPanel">
    <div class="field"><label for="showSel">Show</label><select id="showSel"><option value="">Loading shows…</option></select></div>
  </section>
  <section class="panel">
    <div class="lhead"><h2>Entries <span class="note" id="countNote"></span></h2><span class="btns" style="margin:0"><a class="btn" id="catLink" href="catalogue.html">Catalogue</a><a class="btn" id="payLink" href="payments.html" hidden>Payments</a><a class="btn pri" id="addLink" href="entry.html">+ Add entry</a></span></div>
    <p class="note">To move a dog between Puppy, Junior and Open, drag its card into another class (on a phone, hold the ⠿ handle), or pick the class from its menu.</p>
    <div class="find"><input type="text" id="q" placeholder="Search ring number, dog or breed"></div>
    <p class="note" id="warnNote"></p>
  </section>
  <div id="entries" style="display:flex;flex-direction:column;gap:14px"></div>
</div>
<div class="toast" id="toast"></div>
<script src="vendor/supabase.min.js"></script>
<script src="js/api.js?v=2026-11-08a"></script>
<script src="js/shell.js?v=2026-11-08a"></script>
<script src="js/nav.js?v=2026-11-08a"></script>
<script src="js/schedule.js?v=2026-11-08a"></script>
<script>
mncfShell({page:"entries",title:mncfQuery("show")||"Register dogs",kicker:mncfQuery("show")?"Entries":"Register dogs"});
const esc=mncfEsc, $=id=>document.getElementById(id);
const AGE=["Puppy","Junior","Open","Veteran"], SPECIAL=["AV Locally Bred","Junior Handler","Childrens Class"], PERSON=["Junior Handler","Childrens Class"];
const GROUP_ORDER=["Utility","Hound","Gundog","Toy","Working","Terrier","Pastoral"];
let S={shows:[],breeds:[],dogs:[],groups:GROUP_ORDER,entries:[],show:mncfQuery("show"),editing:null};
const norm=s=>String(s||"").trim().toLowerCase();
const groupOf=breed=>(S.breeds.find(b=>norm(b.Breed)===norm(breed))||{}).Group||"";
function fillShows(){
  $("showSel").innerHTML='<option value="">Pick a show…</option>'+S.shows.map(s=>`<option${s.Show===S.show?" selected":""}>${esc(s.Show)}</option>`).join("");
  const s=S.shows.find(x=>x.Show===S.show);
  $("showSub").textContent=s?[s.Date,s.Judge?"Judge: "+s.Judge:"",s.Status].filter(Boolean).join(" · "):"Pick a show to see its entries.";
  $("awardsLink").href="awards.html"+(S.show?"?show="+encodeURIComponent(S.show):"");
  $("addLink").href="entry.html"+(S.show?"?show="+encodeURIComponent(S.show):"");
  $("catLink").href="catalogue.html"+(S.show?"?show="+encodeURIComponent(S.show):"");$("catLink").hidden=!S.show;$("payLink").href="payments.html"+(S.show?"?show="+encodeURIComponent(S.show):"");$("payLink").hidden=!S.show;
  $("pickPanel").hidden=!!S.show&&!!s;
}
async function loadShow(){
  if(!S.show){$("entries").innerHTML="";return}
  $("entries").innerHTML='<p class="loading">Loading entries…</p>';
  try{const j=await mncfApi("show",{show:S.show});S.entries=j.entries;S.dogs=j.dogs;S.breeds=j.breeds;S.info=j.show;dayBar();drawEntries();
    const back=mncfQuery("edited");if(back){const el=document.querySelector(`.erow[data-row="${CSS.escape(back)}"]`);if(el){el.scrollIntoView({block:"center"});landed(back)}}}
  catch(e){$("entries").innerHTML=`<p class="err">${esc(e.message)}</p>`}
}
// Day picker, when the show is split into judging days (schedule.html)
function dayBar(){
  if(S.day||!S.info||!mncfSchedule.list(S.info).length)return;
  const SL=mncfSchedule.list(S.info),hdr=document.querySelector("header"),wrap=document.createElement("div");hdr.insertBefore(wrap,hdr.querySelector(".jump"));
  const un=S.entries.some(e=>{if(PERSON.includes(e.Class))return mncfSchedule.find(SL,{special:e.Class})<0;return mncfSchedule.find(SL,{breed:e.Class==="AV Locally Bred"?"":e.Breed,group:e.Group||groupOf(e.Breed)})<0});
  S.day=mncfSchedule.bar({mount:wrap,show:S.show,list:SL,hasUnscheduled:un,editHref:"schedule.html?show="+encodeURIComponent(S.show),onChange(){drawEntries();window.scrollTo({top:0})}});
}
// Entries list: one card per breed, with Puppy / Junior / Open lanes for dogs and for bitches.
// Dogs can be dragged (by the handle) or moved with the class menu between lanes of the same sex.
const LANES=["Puppy","Junior","Open"], SEXES=["Dog","Bitch"];
const laneOf=c=>{const m=/^(Puppy|Junior|Open|Veteran) (Dog|Bitch)$/.exec(c||"");return m?{age:m[1],sex:m[2]}:null};
const movable=e=>{const l=laneOf(e.Class);return !!l&&LANES.includes(l.age)};
function entryRow(e){
  const ab=e.Absent===true, l=laneOf(e.Class), mv=movable(e);
  const menu=mv?`<select class="mvsel" data-move="${e._row}" aria-label="Move ${esc(e["Dog name"])} to another class">${LANES.map(a=>`<option${a===l.age?" selected":""}>${a} ${l.sex}</option>`).join("")}</select>`:"";
  const sub=l?[e.Owner].filter(Boolean):[e.Class+(e.Class==="AV Locally Bred"&&e.Breed?" · "+e.Breed:""),e.Owner].filter(Boolean);
  return `<div class="erow${ab?" isabs":""}${mv?" mv":""}" data-row="${e._row}">${mv?`<span class="grip" data-grip="${e._row}" aria-hidden="true" title="Drag to another class">⠿</span>`:""}<span class="no${String(e["Ring No"]).trim()?"":" missing"}">${esc(String(e["Ring No"]).trim()||"No no.")}</span><span><span class="nm">${esc(e["Dog name"])}</span><small>${sub.map(esc).join(" · ")}</small></span><span class="acts">${menu}<label class="given"><input type="checkbox" data-abs="${e._row}"${ab?" checked":""}>Absent</label><button data-edit="${e._row}">Edit</button><button class="danger" data-del="${e._row}">Remove</button></span></div>`;
}
function drawEntries(){
  const ALL=S.entries.filter(e=>!PENDING.has(String(e._row)));
  const q=norm($("q").value);
  // judging days: each entry's session, and the day picked on this phone
  const SL=S.info?mncfSchedule.list(S.info):[],DAY=S.day?S.day.value():"all";
  const dayOf=e=>!SL.length?-1:PERSON.includes(e.Class)?mncfSchedule.find(SL,{special:e.Class}):e.Class==="AV Locally Bred"?mncfSchedule.find(SL,{group:e.Group||groupOf(e.Breed)}):mncfSchedule.find(SL,{breed:e.Breed,group:e.Group||groupOf(e.Breed)});
  const list=ALL.filter(e=>!q||String(e["Ring No"])===q||norm(e["Dog name"]+" "+e.Breed+" "+e.Class).includes(q)).filter(e=>mncfSchedule.matches(DAY,dayOf(e)));
  const nos={};ALL.forEach(e=>{const n=String(e["Ring No"]).trim();if(n)nos[n]=(nos[n]||0)+1});
  const dup=Object.keys(nos).filter(n=>nos[n]>1), missing=ALL.filter(e=>!String(e["Ring No"]).trim()).length;
  $("countNote").textContent=`· ${ALL.length} entries, ${ALL.filter(e=>e.Absent===true).length} absent`;
  $("warnNote").innerHTML=[missing?`<span class="tag warn">${missing} without a ring number</span>`:"",dup.length?`<span class="tag warn">Ring number used twice: ${dup.map(esc).join(", ")}</span>`:""].join(" ");
  const sec=e=>PERSON.includes(e.Class)?e.Class:e.Class==="AV Locally Bred"?"AV Locally Bred":(e.Breed||"Breed not set");
  const gOf=e=>PERSON.includes(e.Class)?-1:e.Class==="AV Locally Bred"?99:(GROUP_ORDER.indexOf(e.Group)+1||98);
  // AV Locally Bred is judged with each group, so on a split show it gets one card per session
  const keyOf=e=>sec(e)+(SL.length&&e.Class==="AV Locally Bred"?"@"+dayOf(e):"");
  const groups={};list.forEach(e=>{const k=keyOf(e);(groups[k]=groups[k]||{g:gOf(e),group:e.Group,title:sec(e),day:dayOf(e),items:[]}).items.push(e)});
  const rank=k=>SL.length?mncfSchedule.rank(SL,groups[k].day):0;
  const keys=Object.keys(groups).sort((a,b)=>rank(a)-rank(b)||groups[a].g-groups[b].g||a.localeCompare(b));
  let lastDay=null;
  const byNo=(a,b)=>(+a["Ring No"]||1e9)-(+b["Ring No"]||1e9)||a["Dog name"].localeCompare(b["Dog name"]);
  $("entries").innerHTML=keys.map(k=>{const G=groups[k], items=G.items.sort(byNo);
    const gname=G.g>0&&G.g<98?G.group+" Group":G.g===98?"Group not set":"Special class";
    let body;
    if(G.g===-1||G.g===99) body=items.map(entryRow).join("");
    else{
      body=SEXES.filter(sx=>items.some(e=>(laneOf(e.Class)||{}).sex===sx)).map(sx=>
        `<div class="lanes sex-${sx.toLowerCase()}" aria-label="${sx==="Dog"?"Dogs":"Bitches"}"><div class="lanes-h"><span class="sexmark">${sx==="Dog"?"♂":"♀"}</span>${sx==="Dog"?"Dogs":"Bitches"}</div>`+
        LANES.map(a=>{const c=`${a} ${sx}`, its=items.filter(e=>e.Class===c);
          return `<section class="lane age-${a.toLowerCase()}" data-lane="${esc(k)}|${c}"><h4>${a} ${sx} <span>${its.length}</span></h4>${its.map(entryRow).join("")||'<p class="lane-empty">Drop a dog here</p>'}</section>`}).join("")+
        (items.some(e=>e.Class==="Veteran "+sx)?`<section class="lane fixed age-veteran"><h4>Veteran ${sx} <span>${items.filter(e=>e.Class==="Veteran "+sx).length}</span></h4>${items.filter(e=>e.Class==="Veteran "+sx).map(entryRow).join("")}</section>`:"")+
        `</div>`).join("");
      const other=items.filter(e=>!laneOf(e.Class));if(other.length)body+=other.map(entryRow).join("");
    }
    let dh="";
    if(SL.length&&DAY==="all"&&G.day!==lastDay){lastDay=G.day;const ss=SL[G.day];dh=`<h2 class="dayhead">${ss?esc(mncfSchedule.heading(ss)):"Not on a judging day yet"}${ss&&ss.title?`<small>${esc(ss.title)}</small>`:""}</h2>`}
    return dh+`<article class="breed"><div class="bhead"><div><small>${esc(gname)}</small><h2>${esc(G.title)}</h2></div><span class="count">${items.length}</span></div>${body}</article>`}).join("")||`<div class="empty">${ALL.length?"No entries match your search.":`No entries yet. <a href="entry.html?show=${encodeURIComponent(S.show||"")}">Add the first dog</a>.`}</div>`;
}
const calm=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
// Show where a dog ended up: glide from where it was dropped (if known), then a short outline flash.
function landed(row,fromRect){
  const el=document.querySelector(`.erow[data-row="${CSS.escape(String(row))}"]`);if(!el)return;
  el.classList.remove("landed");void el.offsetWidth;el.classList.add("landed");
  if(calm())return;
  const r=el.getBoundingClientRect();
  if(fromRect&&el.animate){const dx=fromRect.left-r.left,dy=fromRect.top-r.top;if(Math.abs(dx)+Math.abs(dy)>2)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:240,easing:"cubic-bezier(.2,.8,.2,1)"})}
  else if(r.bottom<0||r.top>innerHeight)el.scrollIntoView({block:"center",behavior:"smooth"});
}
// Redraw, letting class lanes grow and shrink smoothly to their new size instead of jumping.
function smoothDraw(){
  if(calm()||!Element.prototype.animate){drawEntries();return}
  const before={};document.querySelectorAll(".lane[data-lane]").forEach(l=>before[l.dataset.lane]=l.getBoundingClientRect().height);
  drawEntries();
  document.querySelectorAll(".lane[data-lane]").forEach(l=>{const h0=before[l.dataset.lane];if(h0==null)return;const h1=l.getBoundingClientRect().height;
    if(Math.abs(h1-h0)>1)l.animate([{height:h0+"px"},{height:h1+"px"}],{duration:260,easing:"cubic-bezier(.2,.8,.2,1)"})});
}
// Redraw only when the server's copy differs from what's already on screen, so animations aren't cut short.
const sameAs=list=>JSON.stringify(list)===JSON.stringify(S.entries);
// Move an entry to another class, keeping everything else. Shows the change at once, undoes it if saving fails.
// After saving, the toast offers Undo, which moves the dog back.
async function moveEntry(row,cls,fromRect,isUndo){
  const e=S.entries.find(x=>x._row==row);if(!e||e.Class===cls)return;
  const from=e.Class;e.Class=cls;smoothDraw();landed(row,fromRect);
  try{const j=await mncfApi("saveEntry",{entry:{Show:S.show,"Ring No":String(e["Ring No"]||"").trim(),"Dog name":e["Dog name"],Class:cls,Absent:e.Absent===true,_row:e._row},dog:null});
    if(!sameAs(j.entries)){S.entries=j.entries;drawEntries()}
    mncfToast(isUndo?`${e["Dog name"]} moved back to ${cls}`:`${e["Dog name"]} moved to ${cls}`,isUndo?{}:{action:"Undo",onAction:()=>moveEntry(row,from,null,true)})}
  catch(er){e.Class=from;smoothDraw();mncfToast(er.message)}
}
// Removing waits a few seconds so it can be undone; it's sent straight away if you leave the page.
const PENDING=new Map();
function removeEntry(e){
  const id=String(e._row);PENDING.set(id,setTimeout(()=>commitRemove(id),5000));smoothDraw();
  mncfToast(`${e["Dog name"]} removed from this show`,{action:"Undo",onAction(){if(!PENDING.has(id))return;clearTimeout(PENDING.get(id));PENDING.delete(id);smoothDraw();landed(id)}});
}
async function commitRemove(id){
  if(!PENDING.has(id))return;clearTimeout(PENDING.get(id));PENDING.delete(id);
  const e=S.entries.find(x=>String(x._row)===id);if(!e)return;
  try{const j=await mncfApi("deleteEntry",{_row:e._row,show:S.show,name:e["Dog name"]});S.entries=j.entries;drawEntries()}
  catch(er){drawEntries();mncfToast(`${e["Dog name"]} wasn't removed: ${er.message}`)}
}
const flushRemoves=()=>Promise.all([...PENDING.keys()].map(commitRemove));
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushRemoves()});
window.addEventListener("pagehide",flushRemoves);
// Leaving through a link or tab: finish any removal first.
document.addEventListener("click",async ev=>{
  const a=ev.target.closest&&ev.target.closest("a[href]");if(!a||!PENDING.size||ev.defaultPrevented||a.target)return;
  ev.preventDefault();await flushRemoves();location.href=a.href;
},true);
// Drag and drop with pointer events. With a mouse, grab a dog's card anywhere (not on its buttons);
// by touch, grab the ⠿ handle so the page still scrolls normally. A drag starts after a small move, so taps still work.
(function(){
  let d=null, pend=null;
  const sec2=e=>e.Breed||"Breed not set";
  const ok=l=>l&&d&&l.dataset.lane.startsWith(d.breed+"|")&&(laneOf(l.dataset.lane.slice(d.breed.length+1))||{}).sex===d.sex;
  const laneAt=(x,y)=>{const el=document.elementFromPoint(x,y);const l=el&&el.closest(".lane[data-lane]");return ok(l)?l:null};
  function scroll(){if(!d)return;const h=innerHeight,y=d.y,edge=90;const v=y<edge?-(edge-y)/4:y>h-edge?(y-(h-edge))/4:0;if(v)scrollBy(0,v);d.raf=requestAnimationFrame(scroll)}
  function start(p){
    const e=S.entries.find(x=>x._row==p.rowId);if(!e||!movable(e))return;
    const row=p.row,r=row.getBoundingClientRect(),ghost=row.cloneNode(true);
    ghost.classList.add("ghost");Object.assign(ghost.style,{width:r.width+"px",left:r.left+"px",top:r.top+"px"});document.body.appendChild(ghost);
    row.classList.add("dragging");
    d={row:e._row,breed:sec2(e),sex:laneOf(e.Class).sex,from:e.Class,ghost,src:row,dx:p.x-r.left,dy:p.y-r.top,x:p.x,y:p.y,over:null,id:p.id};
    document.querySelectorAll(".lane[data-lane]").forEach(l=>{if(ok(l))l.classList.add("can")});
    document.body.classList.add("dragmode");d.raf=requestAnimationFrame(scroll);
    try{window.getSelection().removeAllRanges()}catch(er){}
  }
  document.addEventListener("pointerdown",ev=>{
    if(ev.button>0||d)return;
    const grip=ev.target.closest("[data-grip]"), row=ev.target.closest(".erow.mv");if(!row)return;
    if(!grip&&(ev.pointerType!=="mouse"||ev.target.closest("button,input,select,label,a")))return;
    pend={rowId:row.dataset.row,row,x:ev.clientX,y:ev.clientY,id:ev.pointerId};
    if(grip){ev.preventDefault();start(pend);pend=null}
  });
  document.addEventListener("pointermove",ev=>{
    if(pend&&ev.pointerId===pend.id){if(Math.hypot(ev.clientX-pend.x,ev.clientY-pend.y)>6){const p=pend;pend=null;start(p)}else return}
    if(!d||ev.pointerId!==d.id)return;ev.preventDefault();d.x=ev.clientX;d.y=ev.clientY;
    d.ghost.style.left=(ev.clientX-d.dx)+"px";d.ghost.style.top=(ev.clientY-d.dy)+"px";
    const l=laneAt(ev.clientX,ev.clientY);if(l!==d.over){if(d.over)d.over.classList.remove("over");d.over=l;if(l)l.classList.add("over")}
  },{passive:false});
  function end(ev){
    pend=null;
    if(!d||ev.pointerId!==d.id)return;const t=d;d=null;cancelAnimationFrame(t.raf);const gr=t.ghost.getBoundingClientRect();t.ghost.remove();t.src.classList.remove("dragging");
    document.body.classList.remove("dragmode");document.querySelectorAll(".lane.can,.lane.over").forEach(l=>l.classList.remove("can","over"));
    if(ev.type==="pointerup"&&t.over){const cls=t.over.dataset.lane.slice(t.breed.length+1);if(cls!==t.from)moveEntry(t.row,cls,gr)}
  }
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
  // Stop the browser's own text/image drag from taking over a mouse drag.
  document.addEventListener("dragstart",ev=>{if(ev.target.closest&&ev.target.closest(".erow.mv"))ev.preventDefault()});
})();
$("showSel").onchange=()=>{S.show=$("showSel").value;location.href="register.html"+(S.show?"?show="+encodeURIComponent(S.show):"")};
$("q").addEventListener("input",drawEntries);
document.addEventListener("click",async ev=>{
  const t=ev.target;
  if(t.dataset.edit){await flushRemoves();location.href="entry.html?show="+encodeURIComponent(S.show)+"&edit="+encodeURIComponent(t.dataset.edit);return}
  if(t.dataset.del){
    if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Tap to confirm";setTimeout(()=>{t.dataset.armed="";t.textContent="Remove"},3000);return}
    const e=S.entries.find(x=>x._row==t.dataset.del);if(e)removeEntry(e);
  }
});
document.addEventListener("change",async ev=>{
  const t=ev.target;if(t.dataset.move){moveEntry(t.dataset.move,t.value);return}
  if(!t.dataset.abs)return;const e=S.entries.find(x=>x._row==t.dataset.abs);
  try{await mncfApi("setAbsent",{_row:e._row,show:S.show,absent:t.checked});e.Absent=t.checked;drawEntries()}
  catch(er){t.checked=!t.checked;mncfToast(er.message)}
});
(async()=>{
  const c=mncfCache.get("bootstrap");
  if(c){Object.assign(S,{shows:c.shows,breeds:c.breeds,dogs:c.dogs,groups:c.groups||GROUP_ORDER});fillShows()}
  try{const j=await mncfApi("bootstrap");mncfCache.set("bootstrap",j);Object.assign(S,{shows:j.shows,breeds:j.breeds,dogs:j.dogs,groups:j.groups});fillShows()}
  catch(e){$("entries").innerHTML=`<p class="err">${esc(e.message)}</p>`}
  loadShow();
})();
</script>
<script>mncfJumpNav({containers:["#entries"],rounds:false});</script>
</body>
</html>
